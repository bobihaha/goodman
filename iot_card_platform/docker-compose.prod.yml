services:
  nginx:
    image: nginx:1.27-alpine
    container_name: iot_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - iot_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: iot_frontend
    restart: always
    networks:
      - iot_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_backend
    restart: always
    env_file:
      - .env.production
    expose:
      - "8000"
    depends_on:
      - mysql
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - iot_net

  redis:
    image: redis:7.4-alpine
    container_name: iot_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - iot_net

  mysql:
    image: mysql:8.4
    container_name: iot_mysql
    restart: always
    env_file:
      - .env.production
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=150
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=128M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    networks:
      - iot_net

volumes:
  redis_data:
  mysql_data:

networks:
  iot_net:
    driver: bridge

services:
  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: iot_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 128m
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - iot_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: iot_frontend
    restart: always
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - iot_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_backend
    restart: always
    env_file:
      - .env.production
    command:
      - sh
      - -c
      - >
        uvicorn app.main:app --host 0.0.0.0 --port 8000
        --workers ${BACKEND_WORKERS:-1}
    expose:
      - "8000"
    depends_on:
      - mysql
      - redis
    volumes:
      - ./logs:/app/logs
    cpus: 2.00
    mem_limit: 3g
    mem_reservation: 2g
    networks:
      - iot_net

  redis:
    image: docker.m.daocloud.io/library/redis:7.4-alpine
    container_name: iot_redis
    restart: always
    command:
      - sh
      - -c
      - >
        redis-server --appendonly yes
        --maxmemory ${REDIS_MAXMEMORY:-768mb}
        --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    cpus: 1.00
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - iot_net

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: iot_mysql
    restart: always
    env_file:
      - .env.production
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=${MYSQL_MAX_CONNECTIONS:-300}
      - --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-4G}
      - --innodb_log_file_size=${MYSQL_INNODB_LOG_FILE_SIZE:-512M}
      - --tmp_table_size=${MYSQL_TMP_TABLE_SIZE:-64M}
      - --max_heap_table_size=${MYSQL_MAX_HEAP_TABLE_SIZE:-64M}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    cpus: 4.00
    mem_limit: 8g
    mem_reservation: 6g
    networks:
      - iot_net

volumes:
  redis_data:
  mysql_data:

networks:
  iot_net:
    driver: bridge

version: "3.8"

services:
  iot_card_api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    depends_on:
      - mysql
      - redis
    networks:
      - iot_network

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: iot_card_db
      MYSQL_USER: iot_user
      MYSQL_PASSWORD: iot123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iot_network

  redis:
    image: redis:7.0
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iot_network

networks:
  iot_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

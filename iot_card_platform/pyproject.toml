[tool.poetry]
name = "iot_card_platform"
version = "0.1.0"
description = "物联网卡管理平台 - IoT SIM Card Management Platform"
authors = ["Your Name <your@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "==0.141.1"
uvicorn = {extras = ["standard"], version = "==0.52.4"}
python-multipart = "==0.0.32"
sqlalchemy = {extras = ["asyncio"], version = "==2.0.52"}
pydantic = "==2.13.5"
pydantic-settings = "==2.15.0"
python-dotenv = "==1.2.3"
passlib = {extras = ["bcrypt"], version = "==1.7.4"}
bcrypt = "==4.0.1"
pyjwt = "==2.13.0"
cryptography = "==50.0.1"
slowapi = "==0.1.9"
httpx = "==0.28.1"
pytest = "==7.4.4"
aiomysql = "==0.3.2"
pymysql = "==1.1.2"
aiosqlite = "==0.20.0"
redis = "==8.1.0"
apscheduler = "==3.11.3"
alembic = "==1.19.2"
pandas = "==2.1.4"
openpyxl = "==3.1.2"

[tool.poetry.group.dev.dependencies]
black = "==24.4.2"
flake8 = "==6.1.0"
pytest-asyncio = "==0.23.2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
